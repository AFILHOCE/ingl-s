<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road Trip">
<meta name="theme-color" content="#00653B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Road Trip English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00653B; --green-dk:#004F2E; --white:#FFFFFF; --yellow:#F6C343; --yellow-dk:#D9A71F;
  --blue:#1B4A95; --red:#B8202E; --ok:#1E7A3C;
  --bg:#E8EAE5; --surface:#FFFFFF; --text:#26292C; --muted:#5B6166; --line:#C9CDC6; --road:#3A3E42; --soft:#F3F4F1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D2023; --surface:#2A2E32; --text:#EEF0EC; --muted:#A3AAA6; --line:#3E4449; --road:#4A4F54; --soft:#24282B;
  }
}
:root[data-theme="dark"]{
  --bg:#1D2023; --surface:#2A2E32; --text:#EEF0EC; --muted:#A3AAA6; --line:#3E4449; --road:#4A4F54; --soft:#24282B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Overpass",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}

/* The road sign: the one bold element */
.sign{background:var(--green);border-radius:18px;padding:6px;color:var(--white);box-shadow:0 2px 0 var(--green-dk)}
.sign-in{border:3px solid var(--white);border-radius:13px;padding:18px 18px 16px}
.sign .small{font-weight:600;font-size:15px;opacity:.92}
.sign .big{font-weight:800;font-size:44px;letter-spacing:.5px;line-height:1.05;margin-top:4px;word-break:break-word}
.sign .mid{font-weight:600;font-size:22px;margin-top:6px}
.sign-row{display:flex;align-items:center;gap:14px}
.shield{width:54px;height:58px;flex:0 0 auto}

.road{position:relative;height:26px;background:var(--road);border-radius:6px;margin:18px 0 6px;overflow:visible}
.road::after{content:"";position:absolute;left:8px;right:8px;top:12px;height:2px;background:repeating-linear-gradient(90deg,var(--yellow) 0 12px,transparent 12px 22px)}
.road .tick{position:absolute;top:-4px;width:2px;height:34px;background:var(--line);opacity:.9}
.road .car{position:absolute;top:-4px;font-size:24px;transform:translateX(50%);transition:right .6s ease;z-index:2}
.road-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}

.streak{display:flex;gap:10px;align-items:baseline;margin:18px 0 6px}
.streak b{font-size:28px;font-weight:800}
.plan{color:var(--muted);margin-bottom:16px}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px 18px;font-weight:800;font-size:19px;text-align:center}
.btn-go{background:var(--yellow);color:#26292C;box-shadow:0 3px 0 var(--yellow-dk)}
.btn-go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-dk)}
.btn-plain{background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:17px}
.btn[disabled]{opacity:.5;cursor:default}
.links{display:flex;gap:10px;margin-top:14px}
.links .btn{font-size:16px;padding:12px}

.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .x{background:none;border:0;font-size:15px;font-weight:600;color:var(--muted);padding:6px 4px}
.mini-road{flex:1;height:10px;background:var(--road);border-radius:5px;position:relative;overflow:hidden}
.mini-road i{position:absolute;right:0;top:0;bottom:0;background:var(--yellow);border-radius:5px;transition:width .3s}
.bar .count{font-size:14px;color:var(--muted);font-weight:600;min-width:48px;text-align:right}

.prompt{margin:18px 2px 10px;font-weight:600;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:15px 16px;text-align:left;font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center}
.opt .k{font-size:13px;color:var(--muted);border:1.5px solid var(--line);border-radius:6px;min-width:24px;text-align:center;padding:1px 0}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface))}

.audio{display:inline-flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.75);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.pill-dark{background:var(--soft);border:2px solid var(--line);color:var(--text);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.listen-big{display:block;margin:6px auto 4px;background:rgba(255,255,255,.14);border:3px solid #fff;color:#fff;border-radius:50%;width:112px;height:112px;font-size:44px}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel h3{font-size:20px;font-weight:800}
.panel .pt{font-size:18px;margin-top:2px}
.ex{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line)}
.ex .en{font-weight:600}
.ex .tr{color:var(--muted);font-size:16px}
.note{margin-top:12px;background:color-mix(in srgb,var(--yellow) 26%,var(--surface));border-left:5px solid var(--yellow);padding:10px 12px;border-radius:6px;font-size:15.5px}
.verdict{font-weight:800;font-size:18px;margin-bottom:6px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)}

input.type{width:100%;font:inherit;font-size:24px;font-weight:600;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);margin-top:14px}
.hint{color:var(--muted);font-size:15px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.page-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.page-h h2{font-size:26px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);display:block}
.heat i.p{background:color-mix(in srgb,var(--green) 40%,var(--surface))}
.heat i.d{background:var(--green)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.hard{margin:8px 0 0;padding:0;list-style:none}
.hard li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.hard li span{color:var(--muted)}
textarea{width:100%;min-height:96px;font:14px/1.4 ui-monospace,Menlo,monospace;border-radius:10px;border:2px solid var(--line);background:var(--soft);color:var(--text);padding:10px;margin-top:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg button{flex:1;min-width:56px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
select{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--text);margin-top:8px}
.muted{color:var(--muted);font-size:15px}
.warn{background:color-mix(in srgb,var(--red) 12%,var(--surface));border:2px solid var(--red);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toggle input{width:24px;height:24px;accent-color:var(--green)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>

["call","ligar, chamar","v","Call me later.","Me liga mais tarde."],
["try","tentar","v","Try again!","Tente de novo!"],

["need","precisar","v","I need help.","Eu preciso de ajuda."],
["feel","sentir","v","I feel tired.","Eu me sinto cansado."],
["leave","sair, deixar","v","We leave at seven.","Nós saímos às sete."],

["year","ano","n","I am twelve years old.","Eu tenho doze anos."],
["day","dia","n","Have a nice day!","Tenha um bom dia!"],
["week","semana","n","See you next week.","Até a próxima semana."],
["month","mês","n","My birthday is next month.","Meu aniversário é no mês que vem."],
["people","pessoas","n","Many people live here.","Muitas pessoas moram aqui."],

["father","pai","n","My father likes soccer.","Meu pai gosta de futebol."],
["brother","irmão","n","My brother is older than me.","Meu irmão é mais velho que eu."],
["sister","irmã","n","My sister plays piano.","Minha irmã toca piano."],
["parents","pais (pai e mãe)","n","My parents work a lot.","Meus pais trabalham muito.","Falso amigo: parents = pai e mãe. Parentes em inglês é relatives."],
["house","casa (construção)","n","Their house is big.","A casa deles é grande."],
["home","lar, casa","n","Let's go home.","Vamos para casa."],

const W={}; WORDS.forEach(w=>W[w[0]]=w);
const POS={v:"verbo",n:"substantivo",adj:"adjetivo",adv:"advérbio",prep:"preposição",conj:"conjunção",pron:"pronome"};
const STOPS=[["New York",0],["Pennsylvania",70],["Ohio",380],["Indiana",617],["Illinois",769],["Iowa",932],["Nebraska",1235],["Wyoming",1690],["Utah",2092],["Nevada",2289],["California",2699],["San Francisco",2900]];
const TRIP=2900;

/* ---------- Storage ---------- */
const KEY="road-trip-english-v1";
let storageOk=true;
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)}
function fresh(){return {v:1,cards:{},xp:0,log:{},settings:{newPerDay:8,rate:0.9,voice:"",autoplay:true}}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.cards)return Object.assign(fresh(),o,{settings:Object.assign(fresh().settings,o.settings||{})})}}catch(e){}
  return fresh();
}
function save(){
  const t=today();Object.keys(S.log).forEach(k=>{if(+k<t-180)delete S.log[k]});
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}
}
try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){storageOk=false}
let S=load();
function L(t){t=t??today();return S.log[t]||(S.log[t]={a:0,c:0,n:0,s:0,done:false})}

/* ---------- Voice ---------- */
const hasTTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let voices=[];
function loadVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang))}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==="settings")renderSettings()}}
function pickVoice(){
  if(!voices.length)return null;
  if(S.settings.voice){const v=voices.find(v=>v.name===S.settings.voice);if(v)return v}
  const pref=/(Ava|Samantha|Evan|Nicky|Zoe|Allison|Tom|Susan|Nathan|Joelle|Noelle)/i;
  const score=v=>(/premium/i.test(v.name)?4:0)+(/enhanced/i.test(v.name)?3:0)+(pref.test(v.name)?2:0)+(v.localService?1:0);
  return voices.slice().sort((a,b)=>score(b)-score(a))[0];
}
function speak(text,rate){
  if(!hasTTS)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";
    u.rate=rate||S.settings.rate;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- Helpers ---------- */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toks(pt){return pt.split(",").map(s=>s.replace(/\(.*?\)/g,"").trim().toLowerCase()).filter(Boolean)}
function overlap(a,b){const A=toks(a);return toks(b).some(t=>A.includes(t))}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’`]/g,"'").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim()}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const shieldSVG=`<svg class="shield" viewBox="0 0 60 64" aria-hidden="true"><defs><clipPath id="shc"><path d="M30 5C21 9 11 9 6 7 4 22 5 43 30 59 55 43 56 22 54 7 49 9 39 9 30 5Z"/></clipPath></defs><path d="M30 1C20 5 9 5 3 3 0 20 1 45 30 63 59 45 60 20 57 3 51 5 40 5 30 1Z" fill="#fff"/><g clip-path="url(#shc)"><rect width="60" height="64" fill="#1B4A95"/><rect width="60" height="18" fill="#B8202E"/></g><text x="30" y="15" text-anchor="middle" font-family="Overpass,sans-serif" font-size="7" font-weight="800" fill="#fff">INTERSTATE</text><text x="30" y="46" text-anchor="middle" font-family="Overpass,sans-serif" font-size="25" font-weight="800" fill="#fff">80</text></svg>`;

function tripInfo(xp){
  const trips=Math.floor(xp/TRIP), m=xp%TRIP;
  let i=STOPS.findIndex(s=>s[1]>m); if(i<0)i=STOPS.length-1;
  return {trips,m,prev:STOPS[i-1]||STOPS[0],next:STOPS[i],left:STOPS[i][1]-m};
}
function streak(){
  const t=today();let d=S.log[t]?.done?t:t-1,n=0;
  while(S.log[d]?.done){n++;d--}
  return n;
}
function dueList(){
  const t=today();
  return WORDS.filter(w=>{const c=S.cards[w[0]];return c&&c.due<=t}).sort((a,b)=>S.cards[a[0]].due-S.cards[b[0]].due);
}
function planToday(extraNew){
  const due=dueList(), reviews=due.slice(0,120);
  const l=L();
  let nNew=extraNew!=null?extraNew:(reviews.length>80?0:Math.max(0,S.settings.newPerDay-l.n));
  const news=WORDS.filter(w=>!S.cards[w[0]]).slice(0,nNew);
  return {reviews,news,backlog:due.length>80};
}
function estMin(p){return Math.max(1,Math.round((p.reviews.length*9+p.news.length*40)/60))}
function modeFor(c){if(!c||c.ivl<3)return "pt";if(c.ivl<10)return hasTTS?"listen":"pt";return "type"}

/* ---------- Views ---------- */
let view="home", sess=null, busy=false, flash="";

function renderHome(){
  view="home";
  const ti=tripInfo(S.xp), st=streak(), p=planToday(), l=L();
  const pct=Math.min(100,ti.m/TRIP*100);
  const ticks=STOPS.slice(1,-1).map(s=>`<i class="tick" style="right:calc(${s[1]/TRIP*100}% - 1px)"></i>`).join("");
  const doneToday=l.done&&p.reviews.length===0&&p.news.length===0;
  const nothingLeft=WORDS.every(w=>S.cards[w[0]]);
  let planTxt;
  if(doneToday) planTxt="Viagem de hoje concluída. Volte amanhã para continuar a estrada.";
  else if(!p.reviews.length&&!p.news.length) planTxt=nothingLeft?"Você já viu todas as palavras. Nada para revisar hoje.":"Nada pendente agora.";
  else planTxt=`Hoje: ${p.reviews.length} ${p.reviews.length===1?"revisão":"revisões"} e ${p.news.length} ${p.news.length===1?"palavra nova":"palavras novas"}. Cerca de ${estMin(p)} min.`;
  const fl=flash;flash="";
  app.innerHTML=`
  ${fl?`<div class="panel" role="status" style="margin:0 0 12px;border-color:var(--green)">${esc(fl)}</div>`:""}
  ${!storageOk?`<div class="warn">Este navegador não está guardando o progresso. Faça o backup no Painel dos pais ao fim de cada treino.</div>`:""}
  <section class="sign" aria-label="Próxima parada">
    <div class="sign-in">
      <div class="sign-row">${shieldSVG}<div><div class="small">${ti.trips?`Viagem ${ti.trips+1}, rumo a San Francisco`:"Rumo a San Francisco"}</div><div class="small">Próxima parada</div></div></div>
      <div class="big">${esc(ti.next[0])}</div>
      <div class="mid">${ti.left} mi</div>
    </div>
  </section>
  <div class="road" role="img" aria-label="${Math.round(pct)}% da viagem percorrida">${ticks}<span class="car" style="right:${pct}%">🚗</span></div>
  <div class="road-labels"><span>San Francisco</span><span>New York</span></div>
  <div class="streak"><b>${st>0?"🔥 "+st:"0"}</b><span>${st===1?"dia seguido":"dias seguidos"}</span></div>
  <p class="plan">${planTxt}${p.backlog&&!doneToday?" Muitas revisões acumuladas: hoje não entram palavras novas.":""}</p>
  ${doneToday||(!p.reviews.length&&!p.news.length)
    ? (nothingLeft?"":`<button class="btn btn-plain" id="extra">Aprender mais 5 palavras</button>`)
    : `<button class="btn btn-go" id="go">${l.a>0?"Continuar a viagem de hoje":"Começar a viagem de hoje"}</button>`}
  <div class="links"><button class="btn btn-plain" id="panel">Painel dos pais</button><button class="btn btn-plain" id="settings">Ajustes</button></div>
  ${S.xp===0&&!Object.keys(S.cards).length?`<p class="muted" style="margin-top:16px">Todo dia você revisa as palavras que o app escolher e aprende algumas novas. Cada acerto é uma milha na estrada de Nova York até San Francisco. Ligue o som do iPhone.</p>`:""}
  `;
  document.getElementById("go")?.addEventListener("click",()=>startSession());
  document.getElementById("extra")?.addEventListener("click",()=>startSession(5));
  document.getElementById("panel").onclick=renderPanel;
  document.getElementById("settings").onclick=renderSettings;
}

function startSession(extraNew){
  if(hasTTS){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
  const p=planToday(extraNew);
  const q=shuffle(p.reviews).map(w=>({k:"quiz",w:w[0]}));
  const gap=Math.max(2,Math.floor(q.length/Math.max(1,p.news.length)));
  p.news.forEach((w,i)=>q.splice(Math.min(q.length,i*gap+i),0,{k:"intro",w:w[0]}));
  sess={queue:q,i:0,a:0,c:0,learned:0,miles:0,failed:new Set(),last:Date.now(),xpStart:S.xp};
  renderItem();
}

function tick(){const now=Date.now();const d=Math.min(60,(now-sess.last)/1000);sess.last=now;L().s+=d}

function header(){
  const total=sess.queue.length, done=sess.i;
  return `<div class="bar"><button class="x" id="quit">Sair</button><div class="mini-road"><i style="width:${total?done/total*100:0}%"></i></div><span class="count">${Math.min(done+1,total)}/${total}</span></div>`;
}
function wordPanel(w,withEn=true){
  return `<div class="panel">
    ${withEn?`<h3>${esc(w[0])}</h3>`:""}
    <div class="pt">${esc(w[1])} <span class="muted">(${POS[w[2]]})</span></div>
    <div class="audio"><button class="pill-dark" data-say="${esc(w[0])}">🔊 Palavra</button><button class="pill-dark" data-say="${esc(w[0])}" data-slow="1">🐢 Devagar</button></div>
    <div class="ex"><div class="en">${esc(w[3])}</div><div class="tr">${esc(w[4])}</div>
    <div class="audio"><button class="pill-dark" data-say="${esc(w[3])}">🔊 Frase</button></div></div>
    ${w[5]?`<div class="note">⚠️ ${esc(w[5])}</div>`:""}
  </div>`;
}
function bindSay(){
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say,b.dataset.slow?0.6:undefined));
  const q=document.getElementById("quit");if(q)q.onclick=()=>{tick();finish(false)};
}

function renderItem(){
  busy=false;
  if(sess.i>=sess.queue.length)return finish(true);
  const it=sess.queue[sess.i], w=W[it.w];
  view="session";
  if(it.k==="intro")return renderIntro(it,w);
  const c=S.cards[it.w];
  it.mode=it.mode||modeFor(c);
  if(it.mode==="listen"&&!hasTTS)it.mode="pt";
  if(it.mode==="pt")renderMC(it,w,"pt");
  else if(it.mode==="listen")renderMC(it,w,"listen");
  else renderType(it,w);
}

function renderIntro(it,w){
  app.innerHTML=`${header()}
  <section class="sign"><div class="sign-in">
    <div class="small">Palavra nova</div>
    <div class="big">${esc(w[0])}</div>
    <div class="audio"><button class="pill" data-say="${esc(w[0])}">🔊 Ouvir</button><button class="pill" data-say="${esc(w[0])}" data-slow="1">🐢 Devagar</button></div>
  </div></section>
  ${wordPanel(w,false)}
  <button class="btn btn-go" id="ok" style="margin-top:16px">Entendi</button>`;
  bindSay();
  if(S.settings.autoplay)speak(w[0]);
  document.getElementById("ok").onclick=()=>{
    tick();
    const t=today();
    if(!S.cards[w[0]]){S.cards[w[0]]={st:"learn",ivl:0,ease:2.3,due:t,reps:0,lapses:0,last:t};L().n++}
    sess.queue.splice(Math.min(sess.queue.length,sess.i+4),0,{k:"quiz",w:w[0],mode:"pt"});
    sess.i++;save();renderItem();
  };
}

function pickDistractors(w,field){
  const seenFirst=arr=>{const a=shuffle(arr.filter(x=>S.cards[x[0]])),b=shuffle(arr.filter(x=>!S.cards[x[0]]));return a.concat(b)};
  let pool=WORDS.filter(x=>x[0]!==w[0]&&!overlap(x[1],w[1]));
  const same=seenFirst(pool.filter(x=>x[2]===w[2])), other=seenFirst(pool.filter(x=>x[2]!==w[2]));
  const pick=[];
  for(const x of same.concat(other)){
    if(pick.length===3)break;
    if(pick.some(p=>overlap(p[1],x[1])||p[0]===x[0]))continue;
    pick.push(x);
  }
  return shuffle([w,...pick]);
}

function renderMC(it,w,kind){
  const opts=pickDistractors(w);
  const label=x=>kind==="pt"?x[1]:x[0];
  app.innerHTML=`${header()}
  <section class="sign"><div class="sign-in" style="text-align:${kind==="listen"?"center":"left"}">
    ${kind==="pt"
      ?`<div class="small">O que significa?</div><div class="big">${esc(w[0])}</div><div class="audio"><button class="pill" data-say="${esc(w[0])}">🔊 Ouvir</button><button class="pill" data-say="${esc(w[0])}" data-slow="1">🐢 Devagar</button></div>`
      :`<div class="small">Qual palavra você ouviu?</div><button class="listen-big" data-say="${esc(w[0])}" aria-label="Ouvir a palavra">🔊</button><button class="pill" data-say="${esc(w[0])}" data-slow="1">🐢 Devagar</button>`}
  </div></section>
  <div class="opts" style="margin-top:16px">${opts.map((x,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(label(x))}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  bindSay();
  if(S.settings.autoplay||kind==="listen")speak(w[0]);
  const btns=[...app.querySelectorAll(".opt")];
  const choose=i=>{
    if(busy)return;busy=true;tick();
    const ok=opts[i][0]===w[0];
    btns.forEach((b,j)=>{b.disabled=true;if(opts[j][0]===w[0])b.classList.add("right")});
    if(!ok)btns[i].classList.add("wrong");
    grade(it,ok);
    if(ok){
      if(kind==="listen")speak(w[0]);
      document.getElementById("fb").innerHTML=`<p class="verdict ok" style="margin-top:14px">Isso! ${kind==="listen"?esc(w[0])+" = "+esc(w[1]):""}</p>`;
      setTimeout(()=>{sess.i++;renderItem()},kind==="listen"?1300:850);
    }else{
      speak(w[0]);
      document.getElementById("fb").innerHTML=`<div class="panel" style="border-color:var(--red)"><p class="verdict no">Quase. A resposta certa é:</p><h3>${esc(w[0])}</h3><div class="pt">${esc(w[1])}</div>
      <div class="audio"><button class="pill-dark" data-say="${esc(w[0])}">🔊 Palavra</button></div>
      <div class="ex"><div class="en">${esc(w[3])}</div><div class="tr">${esc(w[4])}</div><div class="audio"><button class="pill-dark" data-say="${esc(w[3])}">🔊 Frase</button></div></div>
      ${w[5]?`<div class="note">⚠️ ${esc(w[5])}</div>`:""}</div>
      <button class="btn btn-go" id="next" style="margin-top:14px">Continuar</button>`;
      bindSay();
      const n=document.getElementById("next");n.onclick=()=>{sess.i++;renderItem()};n.focus();
    }
  };
  btns.forEach((b,i)=>b.onclick=()=>choose(i));
  keyHandler=e=>{const k=+e.key;if(k>=1&&k<=4&&!busy)choose(k-1)};
}

function renderType(it,w){
  app.innerHTML=`${header()}
  <section class="sign"><div class="sign-in">
    <div class="small">Escreva em inglês</div>
    <div class="big" style="font-size:34px">${esc(w[1])}</div>
    <div class="small" style="margin-top:10px;font-weight:400">${esc(w[4])}</div>
  </div></section>
  <input class="type" id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="en" inputmode="text" aria-label="Sua resposta em inglês" placeholder="Digite aqui">
  <p class="hint">Começa com “${esc(w[0][0])}” e tem ${w[0].replace(/ /g,"").length} letras.</p>
  <div class="row2"><button class="btn btn-plain" id="idk">Não sei</button><button class="btn btn-go" id="chk">Verificar</button></div>
  <div id="fb"></div>`;
  bindSay();
  const inp=document.getElementById("inp");
  setTimeout(()=>inp.focus(),50);
  const check=give=>{
    if(busy)return;busy=true;tick();
    const val=norm(inp.value), target=norm(w[0]);
    const exact=!give&&val===target, near=!give&&!exact&&target.length>=5&&lev(val,target)<=1;
    const ok=exact||near;
    grade(it,ok);
    speak(w[0]);
    inp.disabled=true;document.getElementById("idk").disabled=true;document.getElementById("chk").disabled=true;
    if(exact){
      document.getElementById("fb").innerHTML=`<p class="verdict ok" style="margin-top:14px">Isso! ${esc(w[0])}</p>`;
      setTimeout(()=>{sess.i++;renderItem()},1200);return;
    }
    document.getElementById("fb").innerHTML=`<div class="panel" style="border-color:${ok?"var(--ok)":"var(--red)"}">
      <p class="verdict ${ok?"ok":"no"}">${near?"Quase perfeito! Confira a grafia:":give?"Tudo bem. A palavra é:":"Não foi dessa vez. A palavra é:"}</p>
      <h3>${esc(w[0])}</h3><div class="pt">${esc(w[1])}</div>
      <div class="audio"><button class="pill-dark" data-say="${esc(w[0])}">🔊 Palavra</button><button class="pill-dark" data-say="${esc(w[0])}" data-slow="1">🐢 Devagar</button></div>
      <div class="ex"><div class="en">${esc(w[3])}</div><div class="tr">${esc(w[4])}</div><div class="audio"><button class="pill-dark" data-say="${esc(w[3])}">🔊 Frase</button></div></div>
      ${w[5]?`<div class="note">⚠️ ${esc(w[5])}</div>`:""}</div>
      <button class="btn btn-go" id="next" style="margin-top:14px">Continuar</button>`;
    bindSay();
    const n=document.getElementById("next");n.onclick=()=>{sess.i++;renderItem()};n.focus();
  };
  document.getElementById("chk").onclick=()=>{if(inp.value.trim())check(false)};
  document.getElementById("idk").onclick=()=>check(true);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&inp.value.trim()){e.preventDefault();check(false)}});
  keyHandler=null;
}

/* ---------- Spaced repetition ---------- */
function grade(it,ok){
  const t=today(), c=S.cards[it.w], l=L();
  sess.a++;l.a++;
  if(ok){
    sess.c++;l.c++;
    if(c.st==="rev"&&!sess.failed.has(it.w)){
      let n=Math.max(c.ivl+1,Math.round(c.ivl*c.ease));
      if(n>4)n=Math.round(n*(0.95+Math.random()*0.1));
      c.ivl=Math.min(365,n);
    }else{
      if(c.reps===0){sess.learned++;addMiles(3)}
      c.ivl=1;
    }
    c.st="rev";c.due=t+c.ivl;c.reps++;c.last=t;addMiles(1);
  }else{
    if(c.st==="rev"){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2)}
    c.st="learn";c.ivl=0;c.due=t;c.last=t;
    sess.failed.add(it.w);
    sess.queue.splice(Math.min(sess.queue.length,sess.i+4),0,{k:"quiz",w:it.w,mode:it.mode});
  }
  save();
}
function addMiles(n){S.xp+=n;sess.miles+=n}

function finish(completed){
  keyHandler=null;
  if(hasTTS)speechSynthesis.cancel();
  const l=L();
  const planned=sess.queue.length>0;
  if(completed&&planned){addMiles(20);l.done=true}
  save();
  const before=tripInfo(sess.xpStart), after=tripInfo(S.xp);
  const crossed=(after.trips>before.trips)||(after.next[0]!==before.next[0]);
  const reached=after.trips>before.trips?"San Francisco":after.prev[0];
  if(!completed||!planned){renderHome();return}
  view="end";
  const acc=sess.a?Math.round(sess.c/sess.a*100):0;
  app.innerHTML=`
  <section class="sign"><div class="sign-in">
    <div class="small">${crossed?"Bem-vindo a":"Viagem de hoje concluída"}</div>
    <div class="big">${crossed?esc(reached):"+"+sess.miles+" mi"}</div>
    ${crossed?`<div class="mid">+${sess.miles} mi hoje</div>`:""}
  </div></section>
  <div class="stats" style="margin-top:16px">
    <div class="stat"><b>${acc}%</b><span>de acertos</span></div>
    <div class="stat"><b>${sess.learned}</b><span>${sess.learned===1?"palavra nova aprendida":"palavras novas aprendidas"}</span></div>
    <div class="stat"><b>🔥 ${streak()}</b><span>dias seguidos</span></div>
    <div class="stat"><b>${after.left}</b><span>mi até ${esc(after.next[0])}</span></div>
  </div>
  <button class="btn btn-go" id="home" style="margin-top:18px">Voltar ao início</button>`;
  document.getElementById("home").onclick=renderHome;
}

/* ---------- Painel dos pais ---------- */
function renderPanel(){
  view="panel";
  const t=today(), cards=Object.entries(S.cards);
  const learned=cards.filter(([,c])=>c.st==="rev"||c.reps>0).length;
  const mastered=cards.filter(([,c])=>c.ivl>=21).length;
  let a=0,c=0,s=0,days=0;
  for(let d=t-6;d<=t;d++){const l=S.log[d];if(l){a+=l.a;c+=l.c;s+=l.s;if(l.done)days++}}
  const heat=[];for(let d=t-27;d<=t;d++){const l=S.log[d];heat.push(`<i class="${l?.done?"d":(l?.a?"p":"")}" title="${new Date(d*86400000).toISOString().slice(0,10)}"></i>`)}
  const hard=cards.filter(([,c])=>c.lapses>0).sort((x,y)=>y[1].lapses-x[1].lapses).slice(0,6);
  app.innerHTML=`
  <div class="page-h"><h2>Painel dos pais</h2><button class="btn btn-plain" id="back" style="width:auto;padding:8px 14px;font-size:15px">Voltar</button></div>
  <div class="stats">
    <div class="stat"><b>${learned}</b><span>palavras aprendidas de ${WORDS.length}</span></div>
    <div class="stat"><b>${mastered}</b><span>dominadas (revisão a cada 3+ semanas)</span></div>
    <div class="stat"><b>${a?Math.round(c/a*100)+"%":"–"}</b><span>acertos nos últimos 7 dias</span></div>
    <div class="stat"><b>${Math.round(s/60)} min</b><span>estudados nos últimos 7 dias (${days} de 7 dias completos)</span></div>
  </div>
  <div class="panel"><h3>Últimos 28 dias</h3>
    <div class="heat">${heat.join("")}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>completo</span><span><i style="background:color-mix(in srgb,var(--green) 40%,var(--surface))"></i>incompleto</span><span><i style="background:var(--line)"></i>não estudou</span></div>
    <p class="muted" style="margin-top:8px">🔥 ${streak()} dias seguidos. O último quadrado é hoje.</p>
  </div>
  <div class="panel"><h3>Palavras que mais erra</h3>
    ${hard.length?`<ul class="hard">${hard.map(([k,c])=>`<li>${esc(k)} <span>${esc(W[k]?.[1]||"")}, ${c.lapses}x</span></li>`).join("")}</ul>`:`<p class="muted" style="margin-top:6px">Nenhum esquecimento registrado ainda.</p>`}
  </div>
  <div class="panel"><h3>Backup do progresso</h3>
    <p class="muted" style="margin-top:4px">O progresso fica guardado só neste aparelho e neste navegador. Guarde um código de backup de vez em quando (por exemplo, mande para você no WhatsApp).</p>
    <button class="btn btn-plain" id="mk" style="margin-top:10px">Gerar código de backup</button>
    <textarea id="bk" readonly style="display:none" aria-label="Código de backup"></textarea>
    <p class="muted" id="bkmsg" style="margin-top:6px"></p>
    <textarea id="rs" placeholder="Cole aqui um código de backup para restaurar" aria-label="Colar código de backup"></textarea>
    <button class="btn btn-plain" id="restore" style="margin-top:10px">Restaurar backup</button>
    <p class="muted" id="rsmsg" style="margin-top:8px"></p>
  </div>`;
  document.getElementById("back").onclick=renderHome;
  document.getElementById("mk").onclick=async()=>{
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const ta=document.getElementById("bk");ta.style.display="block";ta.value=code;ta.focus();ta.select();
    let msg="Código gerado. Toque no campo, selecione tudo e copie.";
    try{await navigator.clipboard.writeText(code);msg="Código copiado. Cole e guarde em um lugar seguro."}catch(e){}
    document.getElementById("bkmsg").textContent=msg;
  };
  let pending=null;
  const rbtn=document.getElementById("restore"), rmsg=document.getElementById("rsmsg");
  rbtn.onclick=()=>{
    if(pending){
      S=Object.assign(fresh(),pending,{settings:Object.assign(fresh().settings,pending.settings||{})});
      save();flash="Backup restaurado.";renderHome();return;
    }
    const raw=document.getElementById("rs").value.trim().replace(/\s+/g,"");
    if(!raw){rmsg.textContent="Cole o código de backup no campo acima.";return}
    try{
      const o=JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!o||typeof o.cards!=="object")throw 0;
      pending=o;
      rbtn.textContent="Toque de novo para substituir o progresso atual";
      rbtn.style.background="var(--green)";rbtn.style.color="#fff";
      rmsg.textContent=`Backup válido com ${Object.keys(o.cards).length} palavras. O progresso atual deste aparelho será substituído.`;
    }catch(e){rmsg.textContent="Código inválido. Confira se colou o código inteiro."}
  };
}

/* ---------- Ajustes ---------- */

    app.querySelectorAll("#rate button").forEach(b=>b.onclick=()=>{st.rate=+b.dataset.r;save();renderSettings();speak("Hello! Let's learn English.")});
    document.getElementById("auto").onchange=e=>{st.autoplay=e.target.checked;save()};
    document.getElementById("test").onclick=()=>speak("Hello! Let's learn English together.");
  }
  let armed=false,armTimer=null;
  const rb=document.getElementById("reset");
  rb.onclick=()=>{
    if(!armed){
      armed=true;
      rb.textContent="Toque de novo para confirmar";
      rb.style.background="var(--red)";rb.style.color="#fff";
      document.getElementById("resetmsg").textContent="Isso apaga palavras, milhas e dias seguidos deste aparelho e não pode ser desfeito.";
      armTimer=setTimeout(()=>{armed=false;rb.textContent="Apagar progresso";rb.style.background="";rb.style.color="var(--red)";document.getElementById("resetmsg").textContent=""},6000);
      return;
    }
    clearTimeout(armTimer);
    S=fresh();
    try{localStorage.removeItem(KEY)}catch(e){}
    save();
    flash="Progresso apagado. A viagem recomeça em New York.";
    renderHome();
  };
}

/* ---------- Keyboard ---------- */
let keyHandler=null;
document.addEventListener("keydown",e=>{
  if(view!=="session")return;
  if(e.key==="Enter"){const n=document.getElementById("next");if(n){e.preventDefault();n.click();return}const ok=document.getElementById("ok");if(ok){e.preventDefault();ok.click();return}}
  if(keyHandler)keyHandler(e);
});

renderHome();
